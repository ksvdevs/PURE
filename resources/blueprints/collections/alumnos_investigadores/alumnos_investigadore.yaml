tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: responsable
            field:
              type: text
              display: Responsable
          -
            handle: asesor
            field:
              type: text
              display: Asesor
          -
            handle: proyecto
            field:
              type: text
              display: Proyecto
          -
            handle: escuela
            field:
              type: text
              display: Escuela
          -
            handle: monto
            field:
              type: text
              display: Monto
          -
            handle: link_resolucion
            field:
              type: link
              display: Link-resolucion
          -
            handle: concurso
            field:
              options:
                -
                  key: 1
                  value: 'Concurso 2018'
                -
                  key: 2
                  value: 'Concurso 2019-I'
                -
                  key: 3
                  value: 'Concurso 2019-II'
                -
                  key: 4
                  value: 'Concurso 2022-I'
                -
                  key: 5
                  value: 'Concurso 2022-II'
                -
                  key: 6
                  value: 'Concurso 2023-I'
                -
                  key: 7
                  value: 'Concurso 2023-II'
                -
                  key: 8
                  value: 'Concurso 2024-I'
                -
                  key: 9
                  value: 'Concurso 2024-II'
                -
                  key: 10
                  value: 'Concurso 2025-I'
                -
                  key: 11
                  value: 'Concurso 2025-II'
                -
                  key: 12
                  value: 'Concurso 2026-I'
                -
                  key: 13
                  value: 'Concurso 2026-II'
              type: select
              display: Concurso
          -
            handle: estado
            field:
              type: toggle
              display: estado
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: 'Alumnos Inv.'
