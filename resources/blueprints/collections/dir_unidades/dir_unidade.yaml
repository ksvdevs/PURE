tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: imagen_director_unidades
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Imagen Director Unidades'
              validate:
                - required
          -
            handle: nombre_director_unidades
            field:
              type: text
              display: 'Nombre Director Unidades'
              validate:
                - required
          -
            handle: correo
            field:
              type: text
              display: correo
          -
            handle: direccion_oficina
            field:
              type: text
              display: 'Dirección oficina'
          -
            handle: oficina
            field:
              container: assets
              type: assets
              display: oficina
          -
            handle: link_ctvitae
            field:
              type: link
              display: Link-CTVITAE
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - dir_unidades
              max_items: 1
              listable: false
              localizable: true
title: 'Dir Unidade'
