tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: imagen_docente
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Imagen docente'
          -
            handle: link
            field:
              type: link
              display: Link
              validate:
                - required
          -
            handle: nombre
            field:
              type: text
              display: 'Nombre docente'
              validate:
                - required
          -
            handle: gmail
            field:
              type: text
              display: Gmail
              validate:
                - required
          -
            handle: carrera
            field:
              options:
                1: Administración
                2: 'Educación Inicial Intercultural Bilingüe'
                3: 'Ciencia Política y Gobernabilidad'
                4: 'Ingeniería Agroindustrial'
                5: 'Ingeniería de Minas'
                6: 'Ingeniería Informática y Sistemas'
                7: 'Ingeniería Civil'
                8: 'Ingeniería Agroecológica y Desarrollo Rural'
                9: 'Medicina Veterinaria y Zootecnia'
              max_items: 1
              type: select
              display: Carrera
              instructions: 'Seleccione la carrera a la que pertenece el Docente'
              validate:
                - required
          -
            handle: estado
            field:
              type: toggle
              display: Estado
          -
            handle: nivel
            field:
              options:
                -
                  key: 1
                  value: I
                -
                  key: 2
                  value: II
                -
                  key: 3
                  value: III
                -
                  key: 4
                  value: IV
                -
                  key: 5
                  value: V
                -
                  key: 6
                  value: VI
                -
                  key: 7
                  value: VII
              type: select
              display: Nivel
              validate:
                - required
          -
            handle: resolucion
            field:
              type: text
              display: Resolucion
          -
            handle: links_rel
            field:
              type: link
              display: Links-rel
          -
            handle: codigo_renacyt
            field:
              type: text
              display: Codigo-renacyt
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: parent
            field:
              type: entries
              collections:
                - doc_renacyt
              max_items: 1
              listable: false
              localizable: true
title: 'Doc RENACYT'
