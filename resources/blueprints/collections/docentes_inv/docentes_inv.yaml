tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              instructions: 'Nombre de Investigador'
          -
            handle: 'n'
            field:
              type: integer
              display: N°
          -
            handle: grado_profesional
            field:
              type: text
              display: 'Grado Profesional'
              validate:
                - required
          -
            handle: departamento_academico
            field:
              type: text
              display: 'Departamento Académico'
              validate:
                - required
          -
            handle: nombre_proyecto
            field:
              type: markdown
              localizable: true
              display: 'Nombre Proyecto'
              validate:
                - required
          -
            handle: correo
            field:
              type: text
              display: correo
          -
            handle: link
            field:
              type: link
              display: Link
          -
            handle: nivel
            field:
              options:
                -
                  key: 1
                  value: A
                -
                  key: 2
                  value: B
                -
                  key: 3
                  value: C
              type: select
              display: Nivel
          -
            handle: estado
            field:
              type: toggle
              display: Estado
          -
            handle: resolucion
            field:
              type: text
              display: Resolucion
          -
            handle: link_resolucion
            field:
              type: link
              display: Link-resolucion
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: parent
            field:
              type: entries
              collections:
                - docentes_inv
              max_items: 1
              listable: false
              localizable: true
title: 'Docentes Inv'
